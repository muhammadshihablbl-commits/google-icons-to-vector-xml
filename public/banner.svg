<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Glowing background circles -->
  <circle cx="200" cy="120" r="140" fill="#2563eb" opacity="0.15" filter="blur(60px)" />
  <circle cx="1000" cy="280" r="160" fill="#10b981" opacity="0.12" filter="blur(70px)" />

  <!-- Center Card Badge -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-140" y="-135" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="-110" cy="-119" r="5" fill="#10b981" />
    <text x="5" y="-113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      2,100+ GOOGLE MATERIAL ICONS
    </text>

    <!-- Main Title -->
    <text x="0" y="-45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Google Icons to Vector XML
    </text>

    <!-- Subtitle -->
    <text x="0" y="-5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Android VectorDrawable XML Generator &amp; One-Click Downloader
    </text>

    <!-- Tech Badges Container -->
    <g transform="translate(0, 50)">
      <!-- Android Badge -->
      <g transform="translate(-190, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" stroke="#3ddc84" stroke-width="1.5" />
        <text x="0" y="5" fill="#3ddc84" font-family="sans-serif" font-size="13" font-weight="700">🤖 Android XML</text>
      </g>
      <!-- Jetpack Compose -->
      <g transform="translate(-50, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" stroke="#4285f4" stroke-width="1.5" />
        <text x="0" y="5" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="700">🚀 Compose</text>
      </g>
      <!-- Batch ZIP -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <text x="0" y="5" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">📦 Batch ZIP</text>
      </g>
      <!-- Real-time -->
      <g transform="translate(210, 0)">
        <rect x="-45" y="-16" width="90" height="32" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
        <text x="0" y="5" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">⚡ Live</text>
      </g>
    </g>
  </g>

  <!-- Left Floating Icons Frame -->
  <g transform="translate(90, 90)" filter="url(#shadow)">
    <rect width="110" height="110" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Android Robot Shape -->
    <path d="M45 42 a10 10 0 0 1 20 0 v6 h-20 z" fill="#3ddc84" />
    <rect x="45" y="52" width="20" height="18" rx="3" fill="#3ddc84" />
    <line x1="41" y1="52" x2="41" y2="66" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" />
    <line x1="69" y1="52" x2="69" y2="66" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Right Floating Code Frame -->
  <g transform="translate(1000, 80)" filter="url(#shadow)">
    <rect width="120" height="120" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="60" y="68" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Bottom Accent Gradient Bar -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#glow)" />
</svg>
